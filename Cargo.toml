[package]
name = "hwd"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = [
	"Sebastiano Vigna <sebastiano.vigna@unimi.it>",
]
description = "A Rust port of the test by Blackman and Vigna for Hamming-weight dependencies in pseudorandom number generators"
repository = "https://github.com/vigna/hwd-rs"
license = "Apache-2.0 OR MIT"
readme = "README.md"
categories = ["algorithms", "mathematics", "command-line-utilities"]
keywords = ["hamming-weight", "prng", "testing", "statistics"]
exclude = ["c-check"]

[package.metadata.docs.rs]
features = ["xoroshiro128plus"]

[dependencies]
rayon = "1"
clap = { version = "4.1.6", features = ["derive", "wrap_help"] }
mmap-rs = "0.7.0"
bytemuck = { version = "1.13.1", features = ["derive"] }
num = { version = "0.4.0", features = ["num-bigint"] }

[dev-dependencies]
anyhow = "1.0.79"

[profile.release]
lto = "fat"
opt-level = 3
panic = "abort"
codegen-units = 1

# Each feature corresponds to a PRNG defined in the prng module. Every PRNG feature
# enables the internal `_prng` marker, which lets the build emit a single clear error
# (rather than a cascade of unresolved-`Prng` errors) when none is selected. Do not
# enable `_prng` directly.

[features]
_prng = []
xorshift128 = ["_prng"]
xorshift128plus = ["_prng"]
xorshift1024 = ["_prng"]
xorshift1024plus = ["_prng"]
xoroshiro128 = ["_prng"]
xoroshiro128plus = ["_prng"]
xoroshiro1024 = ["_prng"]
xoroshiro1024plus = ["_prng"]
well512a = ["_prng"]
